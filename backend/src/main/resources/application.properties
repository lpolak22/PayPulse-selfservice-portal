spring.application.name=paypulse

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paypulse_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:paypulse}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
jwt.refresh-token-idle-ttl=${JWT_REFRESH_TOKEN_IDLE_TTL:30m}
jwt.clock-skew=${JWT_CLOCK_SKEW:60s}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

springdoc.swagger-ui.display-request-duration=true
