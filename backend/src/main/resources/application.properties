spring.application.name=paypulse

spring.datasource.url=jdbc:postgresql://localhost:5432/paypulse_db
spring.datasource.username=postgres
spring.datasource.password=lozinka123

spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

jwt.secret=${JWT_SECRET:}
jwt.issuer=paypulse
jwt.access-token-ttl=15m
jwt.refresh-token-idle-ttl=30m
