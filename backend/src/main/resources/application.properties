spring.application.name=paypulse

spring.datasource.url=jdbc:postgresql://localhost:5432/paypulse_db
spring.datasource.username=postgres
spring.datasource.password=lozinka123

# The dev seed (db/seed) is a repeatable migration; a database seeded once must still start without the dev profile.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080