spring.application.name=paypulse

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paypulse_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:paypulse}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
jwt.refresh-token-idle-ttl=${JWT_REFRESH_TOKEN_IDLE_TTL:30m}
