sevenpay.base-url=${SEVENPAY_BASE:https://api-uat.7pay.hr/v1}
sevenpay.api-key=${SEVENPAY_KEY:}
sevenpay.page-size=100
sevenpay.transaction-page-size=100
sevenpay.max-retries=3
sevenpay.retry-delay=2s
sevenpay.connect-timeout=5s
sevenpay.read-timeout=30s
sevenpay.import.organisation=${SEVENPAY_ORGANISATION:}
sevenpay.import.merchant-oibs=${SEVENPAY_MERCHANT_OIBS:}
sevenpay.sync.enabled=${SEVENPAY_SYNC_ENABLED:false}
sevenpay.sync.initial-days=${SEVENPAY_SYNC_INITIAL_DAYS:30}
sevenpay.sync.overlap-days=${SEVENPAY_SYNC_OVERLAP_DAYS:3}
sevenpay.sync.interval=${SEVENPAY_SYNC_INTERVAL:15m}
