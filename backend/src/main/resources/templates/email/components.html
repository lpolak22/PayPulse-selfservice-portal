<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<table th:fragment="button(href, label)" role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="margin:24px 0;">
    <tr>
        <td bgcolor="#D92D35" style="background-color:#D92D35;border-radius:6px;">
            <a th:href="${href}" th:text="${label}" href="#" target="_blank"
               style="display:inline-block;padding:12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:6px;">Button</a>
        </td>
    </tr>
</table>
<p th:fragment="fallbackLink(href)" style="margin:0;font-size:13px;line-height:20px;color:#6b7280;">
    If the button does not work, copy and open this link:<br>
    <a th:href="${href}" th:text="${href}" href="#" style="color:#D92D35;word-break:break-all;">link</a>
</p>
</body>
</html>
