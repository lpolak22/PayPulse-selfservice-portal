spring.datasource.url=jdbc:postgresql://localhost:5432/paypulse_db
spring.datasource.username=postgres
spring.datasource.password=lozinka123

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

spring.main.web-application-type=none

seed.enabled=true
seed.test-password=${SEED_TEST_PASSWORD}
seed.transaction-count=${SEED_TRANSACTION_COUNT:100000}
seed.batch-size=${SEED_BATCH_SIZE:1000}

